name: SmartHire AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smarthire_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DJANGO_SECRET_KEY: test-key
          DATABASE_ENGINE: sqlite
        run: |
          python backend/manage.py migrate

      - name: Run Backend Test Suite
        env:
          DJANGO_SECRET_KEY: test-key
          DATABASE_ENGINE: sqlite
        run: |
          python backend/manage.py test tests --verbosity=2

  frontend-check:
    name: Frontend Accessibility & Static Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required HTML and JS Assets Exist
        run: |
          test -f frontend/index.html
          test -f frontend/home.html
          test -f frontend/interview.html
          test -f frontend/resume.html
          test -f frontend/skill-gap.html
          test -f frontend/insights.html
          test -f frontend/recruiter.html
          test -f frontend/admin.html
          test -f frontend/report-download.html
          test -f frontend/css/styles.css
          test -f frontend/js/api-v2.js
          test -f frontend/js/app.js
          echo "All 9 production pages and core modules verified."
